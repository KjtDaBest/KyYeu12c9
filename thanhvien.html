    * {
      animation: appear 0.5s ease;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: transparent;
      background-color: transparent;
    }
    @keyframes appear {
      from { opacity: 0; 
      scale: 0.5;}
      to { opacity: 1; scale: 1;}
    }
    </style>
</head>
